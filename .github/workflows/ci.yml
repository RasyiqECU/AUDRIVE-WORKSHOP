name: AUDrive CI/CD


on:
  push:
    branches: [ main, develop, staging ]
  pull_request:
    branches: [ main, develop ]


jobs:
  test:
    runs-on: ubuntu-latest


    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: audrive_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3


      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3


    steps:
    - uses: actions/checkout@v3


    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, mysql, zip, curl, redis
        coverage: xdebug


    - name: Get composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT


    - name: Cache composer dependencies
      uses: actions/cache@v3
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: runner.os-composer-{{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-


    - name: Install Composer dependencies
      run: composer install --prefer-dist --no-progress


    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'


    - name: Install NPM dependencies
      run: npm ci


    - name: Build assets
      run: npm run build


    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"


    - name: Generate key
      run: php artisan key:generate


    - name: Directory permissions
      run: chmod -R 777 storage bootstrap/cache


    - name: Run migrations
      run: php artisan migrate --force
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: audrive_test
        DB_USERNAME: root
        DB_PASSWORD: password
        REDIS_HOST: 127.0.0.1
        REDIS_PORT: 6379


    - name: Run seeders
      run: php artisan db:seed --force
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: audrive_test
        DB_USERNAME: root
        DB_PASSWORD: password


    - name: Run tests with coverage
      run: php artisan test --coverage --min=80
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: audrive_test
        DB_USERNAME: root
        DB_PASSWORD: password
        REDIS_HOST: 127.0.0.1
        REDIS_PORT: 6379


    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella


  lint:
    runs-on: ubuntu-latest


    steps:
    - uses: actions/checkout@v3


    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, xml, ctype, iconv, intl


    - name: Install Composer dependencies
      run: composer install --prefer-dist --no-progress


    - name: Run Pint (Laravel Code Style)
      run: ./vendor/bin/pint --test


    - name: Run PHPStan
      run: ./vendor/bin/phpstan analyse --memory-limit=2G


  security:
    runs-on: ubuntu-latest


    steps:
    - uses: actions/checkout@v3


    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'


    - name: Install Composer dependencies
      run: composer install --prefer-dist --no-progress


    - name: Run security check
      run: composer audit


    - name: Check for vulnerable dependencies
      run: composer check-security || true


  deploy-staging:
    needs: [test, lint, security]
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest


    steps:
    - uses: actions/checkout@v3


    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        # Add your deployment commands here
        # Example: ssh user@staging-server "cd /var/www/audrive && git pull && composer install --no-dev && php artisan migrate --force"


  deploy-production:
    needs: [test, lint, security]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest


    steps:
    - uses: actions/checkout@v3


    - name: Deploy to production
      run: |
        echo "Deploying to production environment..."
        # Add your deployment commands here
        # Example: ssh user@production-server "cd /var/www/audrive && git pull && composer install --no-dev && php artisan migrate --force && php artisan cache:clear"



